{% extends 'base.html' %}
{% block title %}Нова група — НЕМК Суспільство{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <div class="page-header">
      <h4>
        <span class="page-header-icon"><i class="bi bi-plus-circle-fill"></i></span>
        Нова спільнота
      </h4>
      <a href="{% url 'groups' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-x-lg me-1"></i>Скасувати
      </a>
    </div>

    <div class="page-glass-card p-4">
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
          <div style="color:var(--red);font-size:.8rem;margin-top:.3rem;">
            <i class="bi bi-exclamation-circle me-1"></i>{{ field.errors|join:", " }}
          </div>
          {% endif %}
        </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary px-4 fw-700">
            <i class="bi bi-check-lg me-1"></i>Створити
          </button>
          <a href="{% url 'groups' %}" class="btn btn-outline-secondary px-4">Скасувати</a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
