{% extends 'base.html' %}
{% block title %}Створити групу — НЕМК Мережа{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow rounded-4">
      <div class="card-body p-4">
        <h4 class="fw-bold text-primary mb-4"><i class="bi bi-plus-circle me-2"></i>Нова група</h4>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>{% endif %}
          </div>
          {% endfor %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>Створити
            </button>
            <a href="{% url 'groups' %}" class="btn btn-outline-secondary px-4">Скасувати</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
