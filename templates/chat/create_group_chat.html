{% extends 'base.html' %}
{% block title %}Груповий чат — НЕМК Мережа{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow rounded-4">
      <div class="card-body p-4">
        <h4 class="fw-bold text-primary mb-4"><i class="bi bi-people-fill me-2"></i>Новий груповий чат</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Назва чату</label>
            <input type="text" name="name" class="form-control" required placeholder="Назва групового чату">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Додати учасників (з друзів)</label>
            {% for friend in friends %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="users" value="{{ friend.id }}" id="u{{ friend.id }}">
              <label class="form-check-label" for="u{{ friend.id }}">
                <img src="{{ friend.get_avatar_url }}" class="rounded-circle me-1" width="24" height="24" style="object-fit:cover;">
                {{ friend.get_full_name|default:friend.username }}
              </label>
            </div>
            {% empty %}
            <p class="text-muted small">Немає друзів для додавання.</p>
            {% endfor %}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>Створити
            </button>
            <a href="{% url 'conversations' %}" class="btn btn-outline-secondary">Скасувати</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
