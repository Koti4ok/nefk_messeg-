{% extends 'base.html' %}
{% block title %}Налаштування сповіщень — НЕМК Суспільство{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">

    <div class="page-header">
      <h4>
        <span class="page-header-icon"><i class="bi bi-gear-fill"></i></span>
        Сповіщення
      </h4>
      <a href="{% url 'notifications' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Назад
      </a>
    </div>

    <div class="page-glass-card p-4">
      <p style="color:var(--muted);font-size:.87rem;margin-bottom:1.25rem;">
        Обери, про що хочеш отримувати сповіщення.
      </p>
      <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="d-flex align-items-center justify-content-between py-3"
             style="border-bottom:1px solid var(--divider);">
          <label for="{{ field.id_for_label }}" class="form-label mb-0 fw-600"
                 style="color:var(--text);cursor:pointer;">
            {{ field.label }}
          </label>
          <div class="form-check form-switch mb-0">
            {{ field }}
          </div>
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary w-100 fw-700 mt-4">
          <i class="bi bi-check-lg me-1"></i>Зберегти налаштування
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
