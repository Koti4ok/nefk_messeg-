{% extends 'base.html' %}
{% block title %}Налаштування сповіщень — НЕМК Мережа{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow rounded-4">
      <div class="card-body p-4">
        <h4 class="fw-bold text-primary mb-4"><i class="bi bi-gear me-2"></i>Налаштування сповіщень</h4>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="form-check form-switch mb-3">
            {{ field }}
            <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">
              {{ field.label }}
            </label>
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i>Зберегти
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
